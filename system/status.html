<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Status · Pilot Adoption-ELS</title>
  <link rel="icon" type="image/png" href="../assets/img/blue-icon.png" />
  <!-- All local: Bootstrap 4.0.0 + FontAwesome 5.11.2 (same as the real box) + theme -->
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../assets/pilot-theme.css" />
</head>
<body class="shell-pending" data-page="status">
<main id="page" class="page page-wide">

  <!-- Page header + Rocker / Key switch (read-only, as on the real page) -->
  <div class="page-head">
    <div>
      <p class="page-eyebrow">Status</p>
      <h1 class="page-title">Current Settings</h1>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <div class="pp-chip"><span>Rocker Switch</span><span class="pp-badge bad sm">OFF</span></div>
      <div class="pp-chip"><span>Key Switch</span><span class="pp-badge bad sm">OFF</span></div>
    </div>
  </div>

  <div class="row">
    <div class="col-xl-9 min-w-0">

      <!-- Laser currents (real: "Laser{n} Current(mA)") -->
      <section class="pp-card">
        <div class="pp-card-head">
          <h2 class="pp-card-title">Laser Current <span class="light">(mA)</span></h2>
          <span class="mono small-12 text-muted">16 channels</span>
        </div>
        <div id="lasers" class="pp-card-body pp-laser-grid"></div>
      </section>

      <!-- Charts (real metrics: Temp / PSU's / Ethernet / Disk Space × Minutes…Month) -->
      <section class="pp-card">
        <div class="pp-card-head flex-wrap justify-content-between" style="padding-top:12px;padding-bottom:12px">
          <div id="metricTabs" class="pp-segment" role="tablist">
            <button data-metric="T">Temp</button>
            <button data-metric="P">PSU's</button>
            <button data-metric="E">Ethernet</button>
            <button data-metric="D">Disk Space</button>
          </div>
          <div id="scaleTabs" class="pp-segment outline">
            <button data-scale="mins">Minutes</button>
            <button data-scale="hours">Hours</button>
            <button data-scale="days">Days</button>
            <button data-scale="weeks">Weeks</button>
            <button data-scale="month">Month</button>
          </div>
        </div>
        <div class="pp-card-body">
          <div class="d-flex flex-wrap align-items-baseline justify-content-between gap-2 mb-3">
            <h3 id="chartTitle" class="m-0" style="font-size:15px;font-weight:600"></h3>
            <div id="chartLegend" class="d-flex flex-wrap gap-4 small-12 text-muted"></div>
          </div>
          <div class="pp-chart-box"><svg id="chart" preserveAspectRatio="none"></svg></div>
        </div>
      </section>

      <!-- Actions (real: View Logs / Turn All Outputs OFF / Turn Module OFF) -->
      <div class="row mt-4">
        <div class="col-sm-4 mb-3">
          <a href="view-logs.html" class="pp-link-card d-flex align-items-center gap-3">
            <span class="pp-icon lg"><i class="fas fa-file-alt"></i></span>
            <span class="flex-1"><span class="d-block fw-600">View Logs</span><span class="d-block small-12 text-muted">Open appliance logs</span></span>
            <i class="fas fa-arrow-right arrow"></i>
          </a>
        </div>
        <div class="col-sm-4 mb-3">
          <div class="pp-link-card d-flex align-items-center gap-3">
            <span class="pp-icon lg muted"><i class="fas fa-power-off"></i></span>
            <span class="flex-1"><span class="d-block fw-600">Turn All Outputs OFF</span><span class="d-block small-12 text-muted">Outputs <b data-state-for="switch_output" class="text-ok">ON</b></span></span>
            <label class="pp-switch" title="Turn off"><input type="checkbox" id="switch_output" checked /><span class="track"></span><span class="thumb"></span></label>
          </div>
        </div>
        <div class="col-sm-4 mb-3">
          <div class="pp-link-card d-flex align-items-center gap-3">
            <span class="pp-icon lg muted"><i class="fas fa-microchip"></i></span>
            <span class="flex-1"><span class="d-block fw-600">Turn Module OFF</span><span class="d-block small-12 text-muted">Module <b data-state-for="switch_module" class="text-ok">ON</b></span></span>
            <label class="pp-switch" title="Turn off"><input type="checkbox" id="switch_module" checked /><span class="track"></span><span class="thumb"></span></label>
          </div>
        </div>
      </div>
    </div>

    <!-- Status panel (real groups from cgi_statusPageManager.py) -->
    <aside class="col-xl-3 min-w-0">
      <section class="pp-card pp-sticky">
        <div class="pp-card-head">
          <h2 class="pp-card-title">Status</h2>
          <div class="d-flex gap-3 text-muted" style="font-size:11px">
            <span class="d-flex align-items-center gap-2"><span class="pp-dot ok"></span>OK</span>
            <span class="d-flex align-items-center gap-2"><span class="pp-dot warn"></span>Warn</span>
            <span class="d-flex align-items-center gap-2"><span class="pp-dot"></span>N/A</span>
          </div>
        </div>
        <div id="statusPanel" class="pp-rows"></div>
      </section>
    </aside>
  </div>
</main>
<script src="../assets/vendor/jquery/jquery-3.4.1.min.js"></script>
<script src="../assets/vendor/bootstrap/popper.min.js"></script>
<script src="../assets/vendor/bootstrap/bootstrap.min.js"></script>
<script src="../assets/shell.js"></script>
<script>
(function () {
  /* ---------- Dummy data (shapes match the real CGI responses) ---------- */
  // i_drive.set_current — 0 on the real screenshot (Rocker / Key switch OFF)
  var lasers = []; for (var i = 1; i <= 16; i++) lasers.push({ name: "Laser" + i, current: 0 });

  // status: 0 = unavailable, 1 = healthy, 2 = warning   (cgi_statusPageManager.py)
  var STATUS = [
    { name: "Ethernet", icon: "fa-network-wired", open: true, items: [{ name: "eth0", status: 1, detail: "up" }] },
    { name: "Current Controller", icon: "fa-bolt", items:
      lasers.map(function (l) { return { name: l.name + " Current", status: 1, detail: l.current + " mA" }; }) },
    { name: "TEC", icon: "fa-snowflake", items:
      lasers.map(function (l, k) { return { name: "TEC " + (k + 1), status: 1 }; }) },
    { name: "Temperature", icon: "fa-thermometer-half", open: true, items: [{ name: "CPU Temperature", status: 1, detail: "52.6 °C" }] },
    { name: "Power Supply", icon: "fa-plug", open: true, items: [{ name: "core_voltage", status: 1, detail: "0.86 V" }] },
    { name: "Disk Space", icon: "fa-hdd", open: true, items: [
      { name: "Root Disk", status: 1, detail: "25 %" }, { name: "Boot Disk", status: 1, detail: "21 %" }] },
  ];

  /* ---------- Laser tiles ---------- */
  document.getElementById("lasers").innerHTML = lasers.map(function (l, k) {
    return '<div class="pp-tile"><div class="d-flex justify-content-between align-items-center text-muted" style="font-size:11.5px;font-weight:500">' +
      "<span>Laser " + (k + 1) + '</span><span class="pp-dot' + (l.current > 0 ? " ok" : "") + '"></span></div>' +
      '<div class="mono" style="font-size:17px;font-weight:500;margin-top:4px">' + l.current + '<span class="text-muted" style="font-size:11px;margin-left:4px">mA</span></div></div>';
  }).join("");

  /* ---------- Status panel ---------- */
  var DOT = { 0: "", 1: " ok", 2: " warn" };
  document.getElementById("statusPanel").innerHTML = STATUS.map(function (g) {
    var ok = g.items.filter(function (x) { return x.status === 1; }).length;
    var worst = g.items.some(function (x) { return x.status === 2; }) ? 2 : (ok === g.items.length ? 1 : 0);
    var badge = worst === 1 ? "ok" : worst === 2 ? "warn" : "muted";
    return '<details class="pp-acc pp-status-group"' + (g.open ? " open" : "") + ">" +
      '<summary><span class="pp-icon"><i class="fas ' + g.icon + '"></i></span>' +
        '<span class="flex-1 fw-500" style="font-size:13.5px">' + g.name + "</span>" +
        '<span class="pp-badge no-dot sm mono ' + badge + '">' + ok + "/" + g.items.length + "</span>" +
        '<i class="fas fa-chevron-down chev"></i></summary>' +
      "<ul>" + g.items.map(function (x) {
        return '<li><span class="pp-dot' + DOT[x.status] + '"></span><span class="flex-1">' + x.name + "</span>" +
          (x.detail ? '<span class="mono text-muted">' + x.detail + "</span>" : "") + "</li>";
      }).join("") + "</ul></details>";
  }).join("");

  /* ---------- Chart (dummy series; real page uses local Highcharts + RRD data) ---------- */
  var Y_TITLES = { T: "Temperature (°C)", P: "Voltage (V)", E: "Network Rate (packets/s, MB/s)", D: "Disk Used (GB)" };
  var METRIC = { T: "Temperature", P: "Power Supply", E: "Ethernet", D: "Disk Space" };
  var SERIES = {
    T: [{ name: "CPU Temperature", base: 52.6, amp: 2.4 }],
    P: [{ name: "core_voltage", base: 0.86, amp: 0.012 }],
    E: [{ name: "eth0 packets/s", base: 38, amp: 14 }, { name: "eth0 MB/s", base: 4, amp: 3 }],
    D: [{ name: "Root Disk", base: 3.62, amp: 0.05 }, { name: "Boot Disk", base: 0.05, amp: 0.001 }],
  };
  var SCALES = {
    mins:  { n: 60, label: function (k, n) { return k === n - 1 ? "Now" : "-" + (n - 1 - k) + " min"; } },
    hours: { n: 24, label: function (k, n) { return k === n - 1 ? "Now" : "-" + (n - 1 - k) + " h"; } },
    days:  { n: 7,  label: function (k, n) { return k === n - 1 ? "Today" : "-" + (n - 1 - k) + " d"; } },
    weeks: { n: 8,  label: function (k, n) { return k === n - 1 ? "This wk" : "-" + (n - 1 - k) + " wk"; } },
    month: { n: 30, label: function (k, n) { return k === n - 1 ? "Today" : "-" + (n - 1 - k) + " d"; } },
  };
  var PREC = { T: 1, P: 2, E: 0, D: 2 };
  var COLORS = ["#1677FF", "#22A06B"];
  var metric = "T", scale = "mins";

  function seeded(seed) { return function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; }

  function draw() {
    var svg = document.getElementById("chart");
    var W = svg.clientWidth || 800, H = 260, padL = 52, padR = 12, padT = 12, padB = 28;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var sc = SCALES[scale], n = sc.n;
    var rnd = seeded(metric.charCodeAt(0) * 31 + n);
    var data = SERIES[metric].map(function (s) {
      // mean-reverting drift, ending on the current reading shown in the Status panel
      var v = s.base, pts = [];
      for (var k = 0; k < n; k++) { v += (s.base - v) * 0.15 + (rnd() - 0.5) * s.amp * 0.6; pts.push(+v.toFixed(3)); }
      var shift = s.base - pts[n - 1];
      return { name: s.name, pts: pts.map(function (p) { return +(p + shift).toFixed(3); }) };
    });
    var all = [].concat.apply([], data.map(function (d) { return d.pts; }));
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all), span = (hi - lo) || 1;
    lo -= span * 0.25; hi += span * 0.25;
    var x = function (k) { return padL + (W - padL - padR) * k / (n - 1); };
    var y = function (v) { return padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo)); };
    var dec = hi - lo < 1 ? 3 : hi - lo < 10 ? 1 : 0;

    var out = "";
    for (var g = 0; g <= 4; g++) {
      var gv = lo + (hi - lo) * g / 4, gy = y(gv);
      out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + gy + '" y2="' + gy + '" stroke="#E4EAF2"/>' +
        '<text x="' + (padL - 8) + '" y="' + (gy + 4) + '" text-anchor="end" font-family="JetBrains Mono" font-size="10.5" fill="#667085">' + gv.toFixed(dec) + "</text>";
    }
    for (var t = 0; t < 6; t++) {
      var k = Math.round((n - 1) * t / 5);
      out += '<text x="' + x(k) + '" y="' + (H - 8) + '" text-anchor="' + (t === 0 ? "start" : t === 5 ? "end" : "middle") + '" font-family="Inter" font-size="11" fill="#667085">' + sc.label(k, n) + "</text>";
    }
    data.forEach(function (d, i) {
      var path = d.pts.map(function (v, k) { return (k ? "L" : "M") + x(k).toFixed(1) + " " + y(v).toFixed(1); }).join(" ");
      if (i === 0) out += '<path d="' + path + " L" + x(n - 1) + " " + (H - padB) + " L" + x(0) + " " + (H - padB) + ' Z" fill="' + COLORS[0] + '" fill-opacity=".07"/>';
      out += '<path d="' + path + '" fill="none" stroke="' + COLORS[i] + '" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
        '<circle cx="' + x(n - 1) + '" cy="' + y(d.pts[n - 1]) + '" r="3.5" fill="' + COLORS[i] + '"/>';
    });
    svg.innerHTML = out;

    document.getElementById("chartTitle").innerHTML = METRIC[metric] + ' Analytics <span class="text-muted" style="font-size:12px;font-weight:400;margin-left:8px">' + Y_TITLES[metric] + "</span>";
    document.getElementById("chartLegend").innerHTML = data.map(function (d, i) {
      return '<span class="d-flex align-items-center gap-2"><span class="pp-dot" style="width:8px;height:8px;background:' + COLORS[i] + '"></span>' + d.name +
        ' <b class="mono text-ink" style="font-weight:500">' + d.pts[n - 1].toFixed(PREC[metric]) + "</b></span>";
    }).join("");
  }

  function wireTabs(id, attr, set) {
    var btns = document.querySelectorAll("#" + id + " button");
    function paint(val) { btns.forEach(function (b) { b.classList.toggle("is-active", b.getAttribute(attr) === val); }); }
    btns.forEach(function (b) { b.addEventListener("click", function () { set(b.getAttribute(attr)); paint(b.getAttribute(attr)); draw(); }); });
    paint(id === "metricTabs" ? metric : scale);
  }
  wireTabs("metricTabs", "data-metric", function (v) { metric = v; });
  wireTabs("scaleTabs", "data-scale", function (v) { scale = v; });
  window.addEventListener("resize", draw);
  draw();

  /* ---------- Output / module switches (demo: visual only, no CGI call) ---------- */
  ["switch_output", "switch_module"].forEach(function (id) {
    var el = document.getElementById(id), label = document.querySelector('[data-state-for="' + id + '"]');
    el.addEventListener("change", function () {
      label.textContent = el.checked ? "ON" : "OFF";
      label.className = el.checked ? "text-ok" : "text-bad";
    });
  });
})();
</script>
</body>
</html>
