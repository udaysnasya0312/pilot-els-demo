<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SetUp · Pilot Adoption-ELS</title>
  <link rel="icon" type="image/png" href="../assets/img/blue-icon.png" />
  <!-- All local: Bootstrap 4.0.0 + FontAwesome 5.11.2 (same as the real box) + theme -->
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../assets/pilot-theme.css" />
</head>
<body class="shell-pending" data-page="setup">
<main id="page" class="page">

  <div class="page-head">
    <div>
      <p class="page-eyebrow">SetUp</p>
      <h1 class="page-title">Connection</h1>
    </div>
  </div>

  <div id="setup-tabs"></div>

  <div class="row">
    <!-- Ethernet -->
    <div class="col-lg-6 mb-4">
      <section class="pp-card h-100">
        <label class="pp-card-head pp-check-head"><input type="checkbox" data-section="eth" checked />
          <i class="fas fa-network-wired text-brand"></i><span class="pp-card-title">Ethernet</span></label>
        <fieldset id="eth" class="pp-card-body">
          <div class="row">
            <div class="col-sm-6 mb-3"><label class="pp-label" for="ip">IP Address</label><input id="ip" class="form-control mono" value="172.31.14.233" /></div>
            <div class="col-sm-6 mb-3"><label class="pp-label" for="mask">Subnet Mask</label><input id="mask" class="form-control mono" value="255.255.240.0" /></div>
            <div class="col-sm-6 mb-3"><label class="pp-label" for="gw">Default Gateway</label><input id="gw" class="form-control mono" value="172.31.0.1" /></div>
            <div class="col-sm-6 mb-3"><label class="pp-label" for="dns">DNS Server</label><input id="dns" class="form-control mono" value="127.0.0.53" /></div>
          </div>
          <div class="text-right"><button type="button" data-toast class="btn btn-primary">Save</button></div>
        </fieldset>
      </section>
    </div>

    <!-- Serial -->
    <div class="col-lg-6 mb-4">
      <section class="pp-card h-100">
        <label class="pp-card-head pp-check-head"><input type="checkbox" data-section="serial" checked />
          <i class="fas fa-plug text-brand"></i><span class="pp-card-title">Serial</span></label>
        <fieldset id="serial" class="pp-card-body">
          <div class="row">
            <div class="col-sm-6 mb-3"><label class="pp-label" for="baud">BAUD Rate</label><input id="baud" class="form-control mono" value="10" /></div>
            <div class="col-sm-6 mb-3"><label class="pp-label" for="parity">Parity</label><input id="parity" class="form-control mono" value="11" /></div>
            <div class="col-sm-6 mb-3"><label class="pp-label" for="bits">Data bits</label><input id="bits" class="form-control mono" value="12" /></div>
            <div class="col-sm-6 mb-3"><label class="pp-label" for="flow">Flow Control</label><input id="flow" class="form-control mono" value="13" /></div>
          </div>
          <div class="text-right"><button type="button" data-toast class="btn btn-primary">Save</button></div>
        </fieldset>
      </section>
    </div>

    <!-- Remote Storage -->
    <div class="col-12 mb-4">
      <section class="pp-card">
        <label class="pp-card-head pp-check-head"><input type="checkbox" data-section="storage" checked />
          <i class="fas fa-database text-brand"></i><span class="pp-card-title">Remote Storage</span></label>
        <fieldset id="storage" class="pp-card-body">
          <div class="row">
            <div class="col-sm-6 col-lg-3 mb-3"><label class="pp-label" for="share">Share</label><input id="share" class="form-control" value="share" /></div>
            <div class="col-sm-6 col-lg-3 mb-3"><label class="pp-label" for="suser">User</label><input id="suser" class="form-control" value="admin" /></div>
            <div class="col-sm-6 col-lg-3 mb-3">
              <label class="pp-label" for="spass">Password</label>
              <div class="pp-input-reveal">
                <input id="spass" type="password" class="form-control" value="demo-password" />
                <button type="button" data-reveal="spass" class="pp-reveal" aria-label="Show password"><i class="far fa-eye"></i></button>
              </div>
            </div>
            <div class="col-sm-6 col-lg-3 mb-3">
              <label class="pp-label" for="protocol">Protocol</label>
              <select id="protocol" class="form-control"><option value="CIFS">CIFS</option><option value="NFS" selected>NFS</option></select>
            </div>
          </div>
          <div class="text-right"><button type="button" data-toast class="btn btn-primary">Save</button></div>
        </fieldset>
      </section>
    </div>

    <!-- Enable SSH -->
    <div class="col-lg-6 mb-4">
      <section class="pp-card h-100">
        <label class="pp-card-head pp-check-head"><input type="checkbox" data-section="ssh" checked />
          <i class="fas fa-terminal text-brand"></i><span class="pp-card-title">Enable SSH</span></label>
        <fieldset id="ssh" class="pp-card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="d-flex gap-4">
            <label class="pp-check"><input type="radio" name="ssh" checked />Yes</label>
            <label class="pp-check"><input type="radio" name="ssh" />No</label>
          </div>
          <button type="button" data-toast class="btn btn-primary">Save</button>
        </fieldset>
      </section>
    </div>

    <!-- Enable Reverse SSH -->
    <div class="col-lg-6 mb-4">
      <section class="pp-card h-100">
        <label class="pp-card-head pp-check-head"><input type="checkbox" data-section="rssh" checked />
          <i class="fas fa-exchange-alt text-brand"></i><span class="pp-card-title">Enable Reverse SSH</span></label>
        <fieldset id="rssh" class="pp-card-body d-flex flex-wrap align-items-center justify-content-between gap-3">
          <div class="d-flex gap-4">
            <label class="pp-check"><input type="radio" name="rssh" />Yes</label>
            <label class="pp-check"><input type="radio" name="rssh" checked />No</label>
          </div>
          <button type="button" data-toast class="btn btn-primary">Save</button>
        </fieldset>
      </section>
    </div>
  </div>

  <!-- Footer bar: Set Up Email + Previous / Next -->
  <div class="pp-card pp-bar">
    <button type="button" class="btn btn-default" data-toggle="modal" data-target="#emailModal"><i class="fas fa-envelope text-brand"></i>Set Up Email</button>
    <div id="setup-pager"></div>
  </div>

  <!-- Set Up Email (real modal) -->
  <div class="modal fade" id="emailModal" tabindex="-1" role="dialog" aria-labelledby="emailModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h4 class="modal-title" id="emailModalTitle">Set Up Email</h4>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        </div>
        <div class="modal-body">
          <div class="row align-items-center mb-3"><label class="col-sm-4 pp-label m-sm-0" for="recipientEmail">Recipient email</label><div class="col-sm-8"><input id="recipientEmail" type="email" placeholder="Enter email" class="form-control" /></div></div>
          <div class="row align-items-center mb-3"><label class="col-sm-4 pp-label m-sm-0" for="senderEmail">Sender email</label><div class="col-sm-8"><input id="senderEmail" type="email" placeholder="Enter email" class="form-control" /></div></div>
          <label class="pp-check pp-check-box mb-3"><input type="checkbox" id="authenticationCheck" />Authentication (Y/N)</label>
          <div class="row align-items-center mb-3"><label class="col-sm-4 pp-label m-sm-0" for="password">Password</label><div class="col-sm-8"><input id="password" type="password" placeholder="password" class="form-control" /></div></div>
          <div class="row pt-3 mb-3" style="border-top:1px solid var(--line)">
            <div class="col-sm-6 mb-3 mb-sm-0"><label class="pp-label" for="smtpServer">SMTP Server</label><input id="smtpServer" placeholder="SMTP server" class="form-control" /></div>
            <div class="col-sm-6"><label class="pp-label" for="portNumber">Port Number</label><input id="portNumber" placeholder="Port Number" class="form-control mono" /></div>
          </div>
          <div class="pp-check-box">
            <label class="pp-check fw-500"><input type="checkbox" id="alertMessagesON" />Alert messages ON</label>
            <div class="d-flex gap-4 mt-2 pl-4">
              <label class="pp-check small-13 text-muted"><input type="checkbox" value="1" />Info</label>
              <label class="pp-check small-13 text-muted"><input type="checkbox" value="2" />Warning</label>
              <label class="pp-check small-13 text-muted"><input type="checkbox" value="3" />Alert</label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" data-dismiss="modal" data-toast>Accept</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../assets/vendor/jquery/jquery-3.4.1.min.js"></script>
<script src="../assets/vendor/bootstrap/popper.min.js"></script>
<script src="../assets/vendor/bootstrap/bootstrap.min.js"></script>
<script src="../assets/shell.js"></script>
<script src="../assets/setup-tabs.js"></script>
<script src="../assets/ui.js"></script>
<script>
  // Section checkbox enables / disables its fields
  document.querySelectorAll("[data-section]").forEach(function (cb) {
    cb.addEventListener("change", function () { document.getElementById(cb.getAttribute("data-section")).disabled = !cb.checked; });
  });
</script>
</body>
</html>
