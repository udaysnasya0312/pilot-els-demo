<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pilot Login</title>
  <link rel="icon" type="image/png" href="assets/img/blue-icon.png" />
  <!-- All local: Bootstrap 4.0.0 + FontAwesome 5.11.2 (same as the real box) + theme -->
  <link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css" />
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="assets/pilot-theme.css" />
</head>
<body class="login-body">

  <!-- Animated background (telemetry theme): drifting glows, panning grid, light pulses
       travelling along laser paths, pinging sensor nodes, scan sweep.
       Pure CSS/SVG, all local; disabled for prefers-reduced-motion. -->
  <div class="login-bg" aria-hidden="true">
    <div class="login-glow-1"></div>
    <div class="login-glow-2"></div>
    <div class="login-glow-3"></div>
    <div class="login-grid"></div>
    <div class="login-scan"></div>
    <svg class="login-beams" fill="none" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1440 900">
      <defs>
        <linearGradient id="beam" x1="0%" x2="100%" y1="30%" y2="70%">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity=".1" /><stop offset="35%" stop-color="#60a5fa" stop-opacity=".75" />
          <stop offset="65%" stop-color="#2563eb" stop-opacity=".5" /><stop offset="100%" stop-color="#1e3a8a" stop-opacity=".05" />
        </linearGradient>
        <path id="lb1" d="M-100 240 C 350 160, 680 430, 1540 210" />
        <path id="lb2" d="M-100 290 C 380 210, 720 480, 1540 260" />
        <path id="lb3" d="M-100 480 C 460 380, 900 660, 1540 440" />
        <path id="lb4" d="M-100 700 C 420 760, 980 560, 1540 680" />
      </defs>
      <!-- static beams -->
      <use href="#lb1" stroke="url(#beam)" stroke-width="1.75" />
      <use href="#lb2" stroke="url(#beam)" stroke-dasharray="6 4" stroke-width=".75" />
      <use href="#lb3" stroke="url(#beam)" stroke-width=".75" />
      <use href="#lb4" stroke="url(#beam)" stroke-width=".6" opacity=".6" />
      <circle cx="240" cy="220" r="130" stroke="#60a5fa" stroke-dasharray="4 6" stroke-opacity=".12" class="ring-spin" />
      <circle cx="1200" cy="650" r="160" stroke="#93c5fd" stroke-dasharray="3 5" stroke-opacity=".1" class="ring-spin rev" />
      <!-- light pulses travelling along the beams -->
      <use href="#lb1" class="pulse" style="animation-duration:7s" />
      <use href="#lb2" class="pulse thin" style="animation-duration:9s;animation-delay:-3s" />
      <use href="#lb3" class="pulse" style="animation-duration:11s;animation-delay:-6s" />
      <use href="#lb4" class="pulse thin" style="animation-duration:13s;animation-delay:-2s" />
      <!-- sensor nodes on the beams (points computed on the curves) -->
      <g class="nodes">
        <g transform="translate(225 233)"><circle r="3" class="ping" /><circle r="2.2" class="core" /></g>
        <g transform="translate(566 278)"><circle r="3" class="ping" style="animation-delay:-1s" /><circle r="2.2" class="core" /></g>
        <g transform="translate(1005 346)"><circle r="3" class="ping" style="animation-delay:-2.2s" /><circle r="2.2" class="core" /></g>
        <g transform="translate(690 505)"><circle r="3" class="ping" style="animation-delay:-.6s" /><circle r="2.2" class="core" /></g>
        <g transform="translate(1093 525)"><circle r="3" class="ping" style="animation-delay:-1.7s" /><circle r="2.2" class="core" /></g>
      </g>
    </svg>
  </div>

  <header class="login-header">
    <img src="assets/img/logo-home.svg" alt="Pilot Photonics" />
  </header>

  <main class="login-main">
    <div class="login-box">
      <div class="text-center mb-3">
        <span class="login-pill">Lyra-ELS <span>&bull;</span> WDM External Laser Source</span>
      </div>

      <div class="login-card">
        <div class="text-center mb-4">
          <h1>Welcome to Pilot</h1>
          <p class="lead-sub">Sign in to your account and enjoy.</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group mb-3">
            <label for="txtUserName" class="login-label">User Name</label>
            <div class="pp-input-icon">
              <i class="fas fa-user"></i>
              <input id="txtUserName" type="text" class="form-control" autocomplete="username" placeholder="User Name" />
            </div>
          </div>
          <div class="form-group mb-3">
            <label for="txtPassword" class="login-label">Password</label>
            <div class="pp-input-icon pp-input-reveal">
              <i class="fas fa-lock"></i>
              <input id="txtPassword" type="password" class="form-control" autocomplete="current-password" placeholder="Password" />
              <button type="button" id="togglePassword" class="pp-reveal" aria-label="Show password"><i class="far fa-eye"></i></button>
            </div>
          </div>

          <p id="systemError" class="login-error mb-3"></p>

          <button type="submit" id="btnLogin" class="btn btn-primary btn-lg btn-block">Login <i class="fas fa-arrow-right"></i></button>
        </form>
      </div>

      <p class="login-note">Pilot Photonics offers unique Laser Engines, Optical Comb Source and Photonics Integrated Circuit Solutions.</p>
    </div>
  </main>

  <footer class="login-footer">&copy; Pilot Photonics</footer>

<script>
  (function () {
    var pwd = document.getElementById("txtPassword");
    document.getElementById("togglePassword").addEventListener("click", function () {
      var show = pwd.type === "password";
      pwd.type = show ? "text" : "password";
      this.querySelector("i").className = show ? "far fa-eye-slash" : "far fa-eye";
    });
    // DEMO: no CGI auth — any non-empty credentials open the dashboard.
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var u = document.getElementById("txtUserName").value.trim();
      var err = document.getElementById("systemError");
      if (!u || !pwd.value) { err.textContent = "Please enter User Name and Password."; return; }
      location.href = "system/index.html";
    });
  })();
</script>
</body>
</html>
